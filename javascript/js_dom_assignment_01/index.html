<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Color Switcher</h1>

    <div class="swatches" id="swatches">
        <button class="swatch" style="background-color: #1E5AA8;" data-name="Ocean Blue" data-color="#1E5AA8">Ocean Blue</button>
        <button class="swatch" style="background-color: #E8622C;" data-name="Sunset Orange" data-color="#E8622C">Sunset Orange</button>
        <button class="swatch" style="background-color: #4C9A2A;" data-name="Forest Green" data-color="#4C9A2A">Forest Green</button>
        <button class="swatch" style="background-color: #8E44AD;" data-name="Royal Purple" data-color="#8E44AD">Royal Purple</button>
        <button class="swatch" style="background-color: #D4AC0D;" data-name="Golden Sand" data-color="#D4AC0D">Golden Sand</button>
        <button class="swatch" style="background-color: #C0392B;" data-name="Brick Red" data-color="#C0392B">Brick Red</button>
    </div>

    <div class="preview" id="preview"></div>
    <p class="value-display" id="valueDisplay">No color selected</p>

    <script src="script.js"></script>
</body>
</html>
