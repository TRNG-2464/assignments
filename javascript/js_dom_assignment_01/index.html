<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hue & Home — Color Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hue & Home</h1>
    <p>Click a swatch to preview it on the wall.</p>

    <div class="swatches">
        <button class="swatch" value="#1E5AA8">Ocean Blue</button>
        <button class="swatch" value="#E85D04">Sunset Orange</button>
        <button class="swatch" value="#6B8F71">Sage Green</button>
        <button class="swatch" value="#C97B84">Dusty Rose</button>
        <button class="swatch" value="#2F2F2F">Charcoal</button>
    </div>

    <div id="preview" class="preview"></div>
    <p id="color-value">Select a color</p>

    <script src="script.js"></script>
</body>
</html>
