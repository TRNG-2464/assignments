
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasklyst - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Tasklyst</h1>
        <h2>To-Do List</h2>

        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                autocomplete="off"
            >

            <button type="submit" id="addButton">
                Add
            </button>

        </form>

        <p id="taskCounter">0 tasks left</p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
